
name: GoRest API Monitoring

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Check GoRest API response
        run: |
          curl -sS --fail --max-time 10 \
            -o response.json \
            -w "HTTP Status: %{http_code}\nResponse Time: %{time_total}s\n" \
            "https://gorest.co.in/public/v2/users"

      - name: Verify response time
        run: |
          response_time=$(curl -sS -o /dev/null -w "%{time_total}" \
            "https://gorest.co.in/public/v2/users")

          echo "Response time: ${response_time}s"

          awk -v t="$response_time" 'BEGIN {
            if (t >= 0.8) {
              print "FAIL: Response time must be less than 0.8 seconds"
              exit 1
            }
            print "PASS: Response time is less than 0.8 seconds"
          }'
